<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F0F2ED;
  --card:      #FFFFFF;
  --ink:       #1E2D24;
  --green:     #3A6648;
  --green-mid: #5A8C6A;
  --green-soft:#E3EDE6;
  --sage:      #A8BBA0;
  --amber:     #B86E2A;
  --amber-soft:#F5E8D8;
  --muted:     #6B7D6F;
  --line:      #DDE5DE;
  --white:     #FFFFFF;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Layout ── */
.shell { max-width: 580px; margin: 0 auto; padding: 0 0 80px; }

/* ── Top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 14px 18px 0;
}
.topbar-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.date-lbl { font-size: 13px; color: var(--muted); }
.edit-btn { font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: none; cursor: pointer; }
.edit-btn.on { color: var(--green); }

/* ── Tab bar ── */
.tabs { display: flex; gap: 2px; }
.tab {
  flex: 1; padding: 8px 0; border: none; background: none; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--muted);
  border-bottom: 2px solid transparent;
}
.tab.on { color: var(--green); border-bottom-color: var(--green); }

/* ── Section labels ── */
.sec-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--sage);
  padding: 18px 18px 6px;
}

/* ── Card list ── */
.card { background: var(--card); border-radius: 14px; overflow: hidden; margin: 0 12px 4px; }

/* ── Task row ── */
.trow {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
  position: relative;
}
.trow:last-child { border-bottom: none; }
.trow.urgent { background: var(--amber-soft); }

.chk {
  width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--line); background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: transparent; transition: background .12s, border-color .12s;
}
.chk.urgent-chk { border-color: var(--amber); }
.chk.done { border-color: var(--green); background: var(--green); color: #fff; }

.trow-body { flex: 1; min-width: 0; }
.trow-name { font-size: 14px; font-weight: 500; }
.trow.checked .trow-name { color: var(--muted); text-decoration: line-through; }
.trow-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.trow-goals { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.goal-pill {
  font-size: 11px; color: var(--green); background: var(--green-soft);
  padding: 2px 8px; border-radius: 99px;
}

.badge {

<script>
/* ══════════════════════════════════════════════
   DATA & HELPERS
══════════════════════════════════════════════ */
const DAY = 86400000;
const norm   = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const iso    = d => { const x = norm(d); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); };
const pad    = n => String(n).padStart(2,"0");
const daysB  = (a,b) => Math.round((norm(b)-norm(a))/DAY);
const addD   = (d,n) => new Date(norm(d).getTime()+n*DAY);
const esc    = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const UKEDAGER = ["man","tir","ons","tor","fre","lør","søn"];
const UKEDAGER_FULL = ["mandag","tirsdag","onsdag","torsdag","fredag","lørdag","søndag"];
const MND  = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const MND_FULL = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const dow  = d => (norm(d).getDay()+6)%7;  // 0=man … 6=søn

const today = norm(new Date());

/* ══════════════════════════════════════════════
   SCHEDULE TYPES
   Each task has: { id, name, type, schedule, slack, mustDo, cats, goals, info, log, snoozeUntil }
   schedule:
     weekly  → { anchors:[0..6] }   (ukedager)
     interval→ { days:N }
     monthly → { months:[1..12], day?:N, lastWeekOf?:true }
     specific→ { month:N, day:N }   (engangs-lignende, men gjentas hvert år)
══════════════════════════════════════════════ */

function taskDue(task, d){
  const s = task.schedule;
  if (task.snoozeUntil && task.snoozeUntil > iso(d)) return false;
  if (task.type === "weekly"){
    const a = s.anchors;
    const slack = task.slack || 0;
    return a.some(anc => {
      const diff = (dow(d) - anc + 7) % 7;
      if (diff > slack) return false;
      const anchor = addD(d, -diff);
      return !task.log.some(l => l >= iso(anchor) && l <= iso(d));
    });
  }
  if (task.type === "interval"){
    const last = task.log.length ? task.log[task.log.length-1] : null;
    if (!last) return true;
    return daysB(new Date(last), d) >= s.days;
  }
  if (task.type === "monthly"){
    const m = d.getMonth()+1;
    if (!s.months.includes(m)) return false;
    const ym = d.getFullYear()+"-"+pad(m);
    if (task.log.some(l => l.startsWith(ym))) return false;
    // window: lastWeekOf or specific day with slack
    if (s.lastWeekOf){
      const lastDay = new Date(d.getFullYear(), m, 0).getDate();
      const dayOfM  = d.getDate();
      return dayOfM >= lastDay - 6;
    }
    if (s.day){
      const dayOfM = d.getDate();
      const slack  = task.slack || 0;
      return dayOfM >= s.day && dayOfM <= s.day + slack;
    }
    return true; // hele måneden
  }
  return false;
}

function taskDoneToday(task, d){
  if (task.type === "weekly"){
    return task.log.includes(iso(d));
  }
  if (task.type === "interval"){
    const last = task.log.length ? task.log[task.log.length-1] : null;
    return last === iso(d);
  }
  if (task.type === "monthly"){
    const ym = d.getFullYear()+"-"+pad(d.getMonth()+1);
    return task.log.some(l => l.startsWith(ym));
  }
  return false;
}

function scheduleDesc(t){
  const s = t.schedule;
  if (t.type === "weekly") return s.anchors.map(a => UKEDAGER[a]).join(" + ") + (t.slack ? " · ±"+t.slack+" dag" : "");
  if (t.type === "interval") return "hver "+s.days+". dag";
  if (t.type === "monthly"){
    const mStr = s.months.map(m => MND[m-1]).join(", ");
    if (s.lastWeekOf) return "siste uka i " + mStr;
    if (s.day) return pad(s.day)+". i " + mStr;
    return mStr;
  }
  return "";
}

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let tasks    = [];
let goals    = [];
let cats     = [];
let beredskap = { items: [], checked: {}, lastReset: null, locations: [] };

let tab      = "idag";
let editMode = false;
let openInfo = {};
let previewM = null;
const SK     = "arshjul-v4";

/* ══════════════════════════════════════════════
   PERSIST
══════════════════════════════════════════════ */
async function load(){
  try {
    const r = await window.storage.get(SK);
    if (r && r.value){
      const d = JSON.parse(r.value);
      tasks     = d.tasks     || [];
      goals     = d.goals     || [];
      cats      = d.cats      || [];
      beredskap = d.beredskap || { items:[], checked:{}, lastReset:null, locations:[] };
      render(); return;
    }
  } catch(e){}
  // Første gang: helt tomt
  tasks = []; goals = []; cats = [];
  beredskap = { items:[], checked:{}, lastReset:null, locations:[] };
  save(); render();
}
async function save(){
  try { await window.storage.set(SK, JSON.stringify({tasks,goals,cats,beredskap})); } catch(e){}
}

/* ══════════════════════════════════════════════
   SEED DATA  (eksemplene fra din beskrivelse)
══════════════════════════════════════════════ */
const BRANN_INFO = [

  "Pulverapparat: snu opp ned et par ganger slik at pulveret ikke klumper seg.",

function seedDemo(){

  }

  tasks = [

    },
    {

      mustDo:true, cats:["c3"], goals:["g5","g2","g6","g7"],
      info:["Åpne Beredskap-fanen og gå gjennom alle punktene. Fyll opp det som mangler."], log:[],
    },
    {
      id:"t4",
      name:"Se over vår-/høstjakkene, vaske og reparere dem ved behov og legge dem på kott eller bod fram til høsten",
      type:"monthly", schedule:{ months:[5], lastWeekOf:true }, slack:0,
      mustDo:false, cats:["c9"], goals:["g1","g2","g4"], log:[],
    },
    {
      id:"t5",
      name:"Se over vår-/høstjakkene, vaske og reparere dem ved behov og legge dem på kott eller bod fram til våren",
      type:"monthly", schedule:{ months:[10], lastWeekOf:true }, slack:0,
      mustDo:false, cats:["c9"], goals:["g1","g2","g4"], log:[],
    },
    {
      id:"t6",
      name:"Se over vinterjakker og vinterbukser, vaske og reparere dem ved behov og legge dem på kott eller bod fram til neste vinter",
      type:"monthly", schedule:{ months:[4], lastWeekOf:true }, slack:0,
      mustDo:false, cats:["c9"], goals:["g1","g2","g4"], log:[],
    },
    {
      id:"t11", name:"Støvsuge",
      type:"weekly", schedule:{ anchors:[1] }, slack:1,
      mustDo:false, cats:["c5","c10"], goals:["g6","g7","g8"], log:[],
    },
    {
      id:"t12", name:"Sjekke brannslukningsapparat",

/* ══════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════ */
function toggleLog(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  const ti = iso(today);
  t.log = t.log.includes(ti) ? t.log.filter(l=>l!==ti) : [...t.log,ti].sort();
  save(); render();
}
function snoozeTask(id, days){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  t.snoozeUntil = iso(addD(today, days||3));
  save(); render();
}
function deleteTask(id){ tasks = tasks.filter(t=>t.id!==id); save(); render(); }
function setTab(t){ tab=t; previewM=null; render(); }
function setEdit(v){ editMode=v; render(); }
function toggleInfo(id){ openInfo[id]=!openInfo[id]; render(); }
function togglePreview(m){ previewM=(previewM===m)?null:m; render(); }

/* ══════════════════════════════════════════════
   MODAL STATE MACHINE
   step: null | "task" | "task_edit" | "goal_new" | "goal_edit"
         | "cat_new" | "cat_edit"
══════════════════════════════════════════════ */
let modal = null;

function taskToForm(t){
  return {
    id: t.id,
    name: t.name,
    type: t.type,
    anchors: t.schedule.anchors ? [...t.schedule.anchors] : [1],
    slack: t.slack || 0,
    days: t.schedule.days || 7,
    months: t.schedule.months ? [...t.schedule.months] : [],
    day: t.schedule.day || "",
    lastWeekOf: t.schedule.lastWeekOf || false,
    mustDo: t.mustDo || false,
    cats: [...(t.cats||[])],
    goals: [...(t.goals||[])],
  };
}

function openModal(){
  modal = {
    step:"task",
    form:{ name:"", type:"weekly", anchors:[1], slack:1, days:7,
           months:[], day:"", lastWeekOf:false, mustDo:false, cats:[], goals:[] }
  };
  render();
}
function openEditTask(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  modal = { step:"task_edit", form: taskToForm(t) };
  render();
}
function openEditGoal(id){
  const g = goals.find(x=>x.id===id); if(!g) return;
  modal = { step:"goal_edit", form:{ id, name: g.name } };
  render();
}
function openEditCat(id){
  const c = cats.find(x=>x.id===id); if(!c) return;
  modal = { step:"cat_edit", form:{ id, name: c.name, parentId: c.parentId||"" } };
  render();
}
function closeModal(){ modal=null; render(); }

function mf(){ return modal.form; }

function setFormField(k,v){ mf()[k]=v; render(); }
function toggleAnchor(i){ const a=mf().anchors; mf().anchors=a.includes(i)?a.filter(x=>x!==i):[...a,i].sort((x,y)=>x-y); render(); }
function toggleMonth(m){ const a=mf().months; mf().months=a.includes(m)?a.filter(x=>x!==m):[...a,m].sort((x,y)=>x-y); render(); }
function toggleCat(id){ const a=mf().cats; mf().cats=a.includes(id)?a.filter(x=>x!==id):[...a,id]; render(); }
function toggleGoal(id){ const a=mf().goals; mf().goals=a.includes(id)?a.filter(x=>x!==id):[...a,id]; render(); }

function openNewGoal(){ modal.step="goal_new"; modal.form._newGoal=""; render(); }
function saveNewGoal(){
  const name=(mf()._newGoal||"").trim(); if(!name) return;
  const g={id:"g"+Date.now(),name};
  goals.push(g);
  mf().goals=[...mf().goals,g.id];
  modal.step= modal.form.id ? "task_edit" : "task";
  save(); render();
}

function openNewCat(){ modal.step="cat_new"; modal.form._newCat=""; modal.form._newCatParent=""; render(); }
function saveNewCat(){
  const name=(mf()._newCat||"").trim(); if(!name) return;
  const parentId=mf()._newCatParent||undefined;
  const c={id:"c"+Date.now(),name,...(parentId?{parentId}:{})};
  cats.push(c);
  mf().cats=[...mf().cats,c.id];
  modal.step= modal.form.id ? "task_edit" : "task";
  save(); render();
}

function formValid(){
  const f=mf();
  if(!f.name.trim()) return false;
  if(f.type==="weekly" && !f.anchors.length) return false;
  if(f.type==="monthly" && !f.months.length) return false;
  if(!f.goals.length) return false;
  return true;
}

function buildSchedule(f){
  if(f.type==="weekly") return {anchors:f.anchors};
  if(f.type==="interval") return {days:Math.max(1,Number(f.days)||7)};
  const s={months:f.months};
  if(f.lastWeekOf) s.lastWeekOf=true;
  else if(f.day) s.day=Number(f.day);
  return s;
}

function submitTask(){
  if(!formValid()) return;
  const f=mf();
  const t={
    id:"u"+Date.now(), name:f.name.trim(),
    type:f.type, schedule:buildSchedule(f), slack:Number(f.slack)||0,
    mustDo:f.mustDo, cats:f.cats, goals:f.goals, log:[],
  };
  tasks.push(t);
  save(); closeModal();
}

function saveEditTask(){
  if(!formValid()) return;
  const f=mf();
  const idx = tasks.findIndex(t=>t.id===f.id); if(idx<0) return;
  const old = tasks[idx];
  tasks[idx] = {
    ...old,
    name: f.name.trim(), type: f.type,
    schedule: buildSchedule(f), slack: Number(f.slack)||0,
    mustDo: f.mustDo, cats: f.cats, goals: f.goals,
  };
  save(); closeModal();
}

function saveEditGoal(){
  const f=mf();
  const name=f.name.trim(); if(!name) return;
  const g=goals.find(x=>x.id===f.id); if(!g) return;
  g.name=name; save(); closeModal();
}

function deleteGoal(id){
  if(!confirm("Slette dette målet? Rutiner som er knyttet til det mister koblingen.")) return;
  goals=goals.filter(g=>g.id!==id);
  tasks.forEach(t=>{ t.goals=(t.goals||[]).filter(g=>g!==id); });
  save(); closeModal();
}

function saveEditCat(){
  const f=mf();
  const name=f.name.trim(); if(!name) return;
  const c=cats.find(x=>x.id===f.id); if(!c) return;
  c.name=name;
  if(f.parentId) c.parentId=f.parentId; else delete c.parentId;
  save(); closeModal();
}

function deleteCat(id){
  if(!confirm("Slette denne kategorien? Rutiner som er knyttet til den mister koblingen.")) return;
  cats=cats.filter(c=>c.id!==id);
  tasks.forEach(t=>{ t.cats=(t.cats||[]).filter(c=>c!==id); });
  save(); closeModal();
}

/* ══════════════════════════════════════════════
   BEREDSKAP-SJEKKLISTE
══════════════════════════════════════════════ */
let bAddLoc = "";   // selected location when adding new item

function bToggle(id){
  beredskap.checked[id] = !beredskap.checked[id];
  save(); render();
}
function bReset(){
  beredskap.checked = {};
  beredskap.lastReset = iso(today);
  save(); render();
}
function bSetAddLoc(loc){ bAddLoc = loc; render(); }
function bAddItem(){
  const inp = document.getElementById("b-new-inp");
  const trimmed = (inp ? inp.value : "").trim(); if(!trimmed) return;
  const loc = bAddLoc || (beredskap.locations[0]||"");
  beredskap.items.push({ id:"b"+Date.now(), name:trimmed, loc });
  save(); render();
}
function bDeleteItem(id){
  beredskap.items = beredskap.items.filter(x=>x.id!==id);
  delete beredskap.checked[id];
  save(); render();
}
let bNewLocInput = "";
let bShowNewLoc = false;

function bAddLocation(){
  const trimmed = bNewLocInput.trim();
  if(!trimmed) return;
  if(!beredskap.locations.includes(trimmed)){
    beredskap.locations.push(trimmed);
    bAddLoc = trimmed;
  }
  bNewLocInput = "";
  bShowNewLoc = false;
  save(); render();
}
function bDeleteLocation(loc){
  if(!confirm(`Slette lokasjonen «${loc}»? Punkter knyttet til den slettes også.`)) return;
  beredskap.locations = beredskap.locations.filter(l=>l!==loc);
  beredskap.items = beredskap.items.filter(i=>i.loc!==loc);
  if(bAddLoc===loc) bAddLoc = beredskap.locations[0]||"";
  save(); render();
}

/* ══════════════════════════════════════════════
   RENDER HELPERS
══════════════════════════════════════════════ */
function goalName(id){ return (goals.find(g=>g.id===id)||{}).name||""; }
function catName(id){ return (cats.find(c=>c.id===id)||{}).name||""; }

function trowHTML(t, d){
  const done    = taskDoneToday(t, d);
  const urgent  = t.mustDo && !done;
  const last    = t.log.length ? t.log[t.log.length-1] : null;
  const since   = last ? daysB(new Date(last), d) : null;
  const metaStr = last
    ? (since===0 ? "gjort i dag" : `sist for ${since} dag${since===1?"":"er"} siden`)
    : "ikke gjort ennå";
  const goals_  = (t.goals||[]).map(gid=>goalName(gid)).filter(Boolean);

  return `
<div class="trow ${urgent?"urgent":""} ${done?"checked":""}">
  <button class="chk ${done?"done":""} ${urgent?"urgent-chk":""}"
    aria-label="${done?"Merk som ikke gjort":"Merk som gjort"}"
    onclick="toggleLog('${t.id}')">${done?"✓":""}</button>
  <div class="trow-body">
    <div class="trow-name">${esc(t.name)}</div>
    <div class="trow-meta">${esc(scheduleDesc(t))} · ${esc(metaStr)}</div>
    ${goals_.length ? `<div class="trow-goals">${goals_.map(g=>`<span class="goal-pill">${esc(g)}</span>`).join("")}</div>` : ""}
  </div>
  ${t.info?`<button class="info-btn ${openInfo[t.id]?"on":""}" onclick="toggleInfo('${t.id}')">i</button>`:""}
  ${urgent&&!done?`<button class="snooze-btn" onclick="snoozeTask('${t.id}',3)">Utsett 3 d</button>`:""}
  ${editMode?`<button class="edit-icon-btn" aria-label="Rediger" onclick="openEditTask('${t.id}')">✎</button>`:""}
  ${editMode?`<button class="del-btn" onclick="deleteTask('${t.id}')">✕</button>`:""}
</div>
${t.info&&openInfo[t.id]?`<div class="infopanel"><ul>${t.info.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}`;
}

function chip(label, on, onclick){
  return `<button class="chip ${on?"on":""}" onclick="${onclick}">${esc(label)}</button>`;
}

  ${chip("Faste ukedager", f.type==="weekly",   "setFormField('type','weekly')")}

  ${chip("Måneder",        f.type==="monthly",   "setFormField('type','monthly')")}
</div>

${f.type==="weekly"?`
<label class="field-lbl">Dager</label>
<div class="chips">${UKEDAGER.map((d,i)=>chip(d,f.anchors.includes(i),"toggleAnchor("+i+")")).join("")}</div>
<label class="field-lbl">Kan skli (dager)</label>
<input class="inp inp-sm" type="number" min="0" max="6" value="${f.slack}" oninput="mf().slack=this.value">
`:""}

${f.type==="interval"?`
<label class="field-lbl">Hver X. dag</label>
<input class="inp inp-sm" type="number" min="1" value="${f.days}" oninput="mf().days=this.value">
`:""}

${f.type==="monthly"?`
<label class="field-lbl">Måneder</label>
<div class="chips">${MND.map((m,i)=>chip(m,f.months.includes(i+1),"toggleMonth("+(i+1)+")")).join("")}</div>
<label class="field-lbl">Tidspunkt i måneden</label>
<div class="chips">
  ${chip("Hele måneden",    !f.lastWeekOf&&!f.day, "mf().lastWeekOf=false;mf().day='';render()")}
  ${chip("Siste uka",        f.lastWeekOf,           "mf().lastWeekOf=true;mf().day='';render()")}

</div>

<label class="field-lbl">Dag i måneden (f.eks. 20)</label>
<input class="inp inp-sm" type="number" min="1" max="28" value="${f.day}" oninput="mf().day=this.value">
<label class="field-lbl">Ligge inne X dager</label>
<input class="inp inp-sm" type="number" min="0" max="31" value="${f.slack}" oninput="mf().slack=this.value">
`:""}
`:""}

<label class="field-lbl">Kategori(er)</label>

<label class="field-lbl">Knytt til mål
  <span style="color:var(--amber);font-size:11px;font-weight:400;margin-left:4px">${f.goals.length===0?"– obligatorisk":""}</span>
</label>
<div class="chips">${goalSection}</div>

<label class="field-lbl" style="display:flex;align-items:center;gap:8px;cursor:pointer">
  <input type="checkbox" ${f.mustDo?"checked":""} onchange="mf().mustDo=this.checked">
  Må gjøres – henger til den er krysset av
</label>

${isEdit?`<button class="del-full-btn" onclick="deleteTask('${f.id}');closeModal()">Slett rutine</button>`:""}
<button class="save-btn" onclick="${submitFn}" ${valid?"":"disabled"}>${isEdit?"Lagre endringer":"Lagre rutine"}</button>`;

  ${roots.map(c=>`<button class="chip ${parentVal===c.id?"on":""}" onclick="(function(){${isEdit?`mf().parentId='${c.id}'`:`mf()._newCatParent='${c.id}'`};render();})()">${esc(c.name)}</button>`).join("")}
</div>

/* ══════════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════════ */
function render(){
  const curM = today.getMonth()+1;
  const monthsWithTasks = new Set(tasks.flatMap(t=>t.type==="monthly"?t.schedule.months:[]));

  /* build today rows */
  const todayRows = tasks.filter(t=>taskDue(t,today)||taskDoneToday(t,today));
  const monthRows = tasks.filter(t=>{
    if(t.type!=="monthly") return false;
    if(!t.schedule.months.includes(curM)) return false;
    const ym=today.getFullYear()+"-"+pad(curM);
    return t.log.some(l=>l.startsWith(ym));
  });

  let html = `
<div class="topbar">
  <div class="topbar-row">
    <h1>I orden</h1>
    <button class="edit-btn ${editMode?"on":""}" onclick="setEdit(${!editMode})">${editMode?"Ferdig":"Rediger"}</button>
  </div>
  <div class="date-lbl">${UKEDAGER_FULL[dow(today)]} ${today.getDate()}. ${MND_FULL[today.getMonth()]}</div>
  <div class="tabs">
    ${["idag","arshjul","beredskap","kategorier","mal"].map(t2=>`<button class="tab ${tab===t2?"on":""}" onclick="setTab('${t2}')">${{idag:"I dag",arshjul:"Årshjul",beredskap:"Beredskap",kategorier:"Kategorier",mal:"Mål"}[t2]}</button>`).join("")}
  </div>
</div>`;

  /* ── I DAG ── */
  if(tab==="idag"){
    html += `<div class="sec-lbl">Til i dag</div><div class="card">`;
    if(!todayRows.length){
      html += `<div class="empty">${tasks.length===0
        ? "Ingen rutiner ennå. Trykk + for å legge til din første."
        : "Ingenting på planen i dag. 🌿"}</div>`;
    } else {
      html += todayRows.map(t=>trowHTML(t,today)).join("");
    }
    html += `</div>`;

    // Gjort denne måneden (denne fanen)
    if(monthRows.length){
      html += `<div class="sec-lbl">Gjort denne måneden</div><div class="card">`;
      html += monthRows.map(t=>trowHTML(t,today)).join("");
      html += `</div>`;
    }
  }

  /* ── ÅRSHJUL ── */
  if(tab==="arshjul"){
    html += `<div style="height:12px"></div>`;
    html += `<div class="wheel">`;
    MND.forEach((m,i)=>{
      const mi=i+1, isCur=mi===curM, isSel=previewM===mi;
      html += `<button class="wbtn ${isCur?"cur":""} ${isSel?"sel":""}"
        aria-label="${MND_FULL[i]}" onclick="togglePreview(${mi})">
        ${m}<span class="wdot ${monthsWithTasks.has(mi)?"on":""}"></span></button>`;
    });
    html += `</div>`;

    if(previewM){
      const name = MND_FULL[previewM-1];
      const rows = tasks.filter(t=>t.type==="monthly"&&t.schedule.months.includes(previewM));
      html += `<div class="card" style="margin-top:8px">
        <div class="preview-head">${name.charAt(0).toUpperCase()+name.slice(1)}</div>
        ${rows.length===0?`<div class="empty">Ingen oppgaver i ${name}.</div>`:
          rows.map(t=>`<div class="preview-row">
            <span>${esc(t.name)}</span>
            ${t.mustDo?`<span class="must-tag">må gjøres</span>`:""}
          </div>`).join("")}
      </div>`;
    } else {
      html += `<div class="empty" style="text-align:center">Trykk på en måned for å se hva som venter.</div>`;
    }
  }

  /* ── BEREDSKAP ── */
  if(tab==="beredskap"){
    const locs = beredskap.locations || [];
    const total   = beredskap.items.length;
    const nChecked = Object.values(beredskap.checked).filter(Boolean).length;
    const lastReset = beredskap.lastReset;
    if(!bAddLoc && locs.length) bAddLoc = locs[0];

    html += `<div class="sec-lbl">Beredskapsliste</div>`;

    // Progress + reset
    if(total > 0){
      const allDone = nChecked === total;
      html += `<div style="padding:0 12px 10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font-size:13px;color:var(--muted)">${nChecked} av ${total} punkter sjekket</span>
          ${lastReset?`<span style="font-size:11px;color:var(--sage)">nullstilt ${lastReset}</span>`:""}
        </div>
        <div style="height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px">
          <div style="height:100%;width:${Math.round(nChecked/total*100)}%;background:var(--green);border-radius:99px"></div>
        </div>
        <button onclick="bReset()" style="width:100%;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:${allDone?"var(--green)":"var(--muted)"};font-size:13px;font-weight:600;cursor:pointer">
          ${allDone?"✓ Alle sjekket – nullstill til neste runde":"Nullstill avkryssinger"}
        </button>
      </div>`;
    }

    // Columns
    if(!locs.length){
      html += `<div class="empty">Ingen lokasjoner ennå. Legg til en lokasjon nedenfor.</div>`;
    } else {
      html += `<div style="display:grid;grid-template-columns:repeat(${Math.min(locs.length,3)},1fr);gap:8px;padding:0 12px">`;
      locs.forEach(loc=>{
        const locItems = beredskap.items.filter(i=>i.loc===loc);
        const locChecked = locItems.filter(i=>beredskap.checked[i.id]).length;
        html += `<div style="background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)">
          <div style="padding:9px 12px 6px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)">
            <span style="font-size:12px;font-weight:700;color:var(--ink)">${esc(loc)}</span>
            <span style="font-size:11px;color:var(--sage)">${locChecked}/${locItems.length}</span>
          </div>`;
        if(!locItems.length){
          html += `<div style="padding:10px 12px;font-size:12px;color:var(--sage);font-style:italic">Tom</div>`;
        } else {
          locItems.forEach(item=>{
            const on = !!beredskap.checked[item.id];
            html += `<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);${on?"opacity:.55":""}">
              <button class="chk ${on?"done":""}" style="width:20px;height:20px;border-radius:5px;flex-shrink:0;margin-top:1px" onclick="bToggle('${item.id}')">${on?"✓":""}</button>
              <span style="font-size:13px;flex:1;line-height:1.4;${on?"text-decoration:line-through;color:var(--muted)":""}">${esc(item.name)}</span>
              ${editMode?`<button class="del-btn" style="font-size:12px" onclick="bDeleteItem('${item.id}')">✕</button>`:""}
            </div>`;
          });
        }
        html += `${editMode?`<button data-loc="${esc(loc)}" onclick="bDeleteLocation(this.dataset.loc)" style="width:100%;padding:7px 0;border:none;background:none;color:#c0392b;font-size:12px;font-weight:600;cursor:pointer">Slett lokasjon</button>`:""}
        </div>`;
      });
      html += `</div>`;
    }

    // Add new item
    if(locs.length){
      html += `<div style="margin:10px 12px 0;background:var(--card);border-radius:12px;border:1px solid var(--line);padding:12px">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Legg til punkt</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        ${locs.map(l=>`<button data-loc="${esc(l)}" onclick="bSetAddLoc(this.dataset.loc)" class="chip ${bAddLoc===l?"on":""}" style="font-size:12px;padding:4px 10px">${esc(l)}</button>`).join("")}
        </div>
        <div style="display:flex;gap:8px">
          <input id="b-new-inp" class="inp" type="text" placeholder="Hva skal være på lager?" style="flex:1;font-size:14px" onkeydown="if(event.key==='Enter')bAddItem()">
          <button onclick="bAddItem()" style="padding:10px 14px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:16px;font-weight:700;cursor:pointer">+</button>
        </div>
      </div>`;
    }

    // Add location
    html += `<div style="margin:8px 12px 0;background:var(--card);border-radius:12px;border:1.5px dashed var(--sage);overflow:hidden">`;
    if(!bShowNewLoc){
      html += `<button onclick="bShowNewLoc=true;render()" style="width:100%;padding:11px 0;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer">+ Ny lokasjon</button>`;
    } else {
      html += `<div style="display:flex;gap:8px;padding:10px">
        <input id="b-loc-inp" class="inp" type="text" placeholder="Navn på lokasjon …"
          style="flex:1;font-size:14px"
          oninput="bNewLocInput=this.value"
          onkeydown="if(event.key==='Enter')bAddLocation();if(event.key==='Escape'){bShowNewLoc=false;render();}">
        <button onclick="bAddLocation()" style="padding:10px 14px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:15px;font-weight:700;cursor:pointer">+</button>
        <button onclick="bShowNewLoc=false;render()" style="padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:13px;cursor:pointer">Avbryt</button>
      </div>`;
    }
    html += `</div>`;
  }

  /* ── KATEGORIER ── */
  if(tab==="kategorier"){
    const roots = cats.filter(c=>!c.parentId);
    if(!roots.length){
      html += `<div class="empty">Ingen kategorier ennå. Legg til en rutine for å opprette kategorier.</div>`;
    } else {
      roots.forEach(root=>{
        const kids = cats.filter(c=>c.parentId===root.id);
        const rootTasks = tasks.filter(t=>t.cats.includes(root.id));
        const allCatIds = [root.id, ...kids.map(k=>k.id)];
        const anyTask = tasks.some(t=>t.cats.some(c=>allCatIds.includes(c)));
        if(!anyTask) return;

        html += `<div class="sec-lbl">${esc(root.name)}${editMode?` <button class="edit-icon-btn" style="font-size:12px" aria-label="Rediger kategori" onclick="openEditCat('${root.id}')">✎</button>`:""}</div>`;

        if(rootTasks.length){
          html += `<div class="card">${rootTasks.map(t=>trowHTML(t,today)).join("")}</div>`;
        }

        kids.forEach(kid=>{
          const kidTasks = tasks.filter(t=>t.cats.includes(kid.id));
          if(!kidTasks.length) return;
          html += `<div class="card" style="margin-top:4px">
            <div class="subcat-lbl">${esc(kid.name)}${editMode?` <button class="edit-icon-btn" style="font-size:12px" aria-label="Rediger underkategori" onclick="openEditCat('${kid.id}')">✎</button>`:""}</div>
            ${kidTasks.map(t=>trowHTML(t,today)).join("")}
          </div>`;
        });
      });
    }
  }

  /* ── MÅL ── */
  if(tab==="mal"){
    if(!goals.length){
      html += `<div class="empty">Ingen mål ennå. De opprettes når du legger til rutiner.</div>`;
    } else {
      goals.forEach(g=>{
        const linked = tasks.filter(t=>(t.goals||[]).includes(g.id));
        html += `<div class="goal-card">
          <div class="goal-head">
            <div class="goal-name">${esc(g.name)}</div>
            ${editMode?`<button class="edit-icon-btn" aria-label="Rediger mål" onclick="openEditGoal('${g.id}')">✎</button>`:""}
          </div>`;
        if(linked.length){
          html += `<div class="goal-tasks">`;
          linked.forEach(t=>{
            html += `<div class="goal-task-item">· ${esc(t.name)}</div>`;
          });
          html += `</div>`;
        } else {
          html += `<div class="goal-tasks"><div class="goal-task-item" style="font-style:italic">Ingen rutiner knyttet til dette målet ennå.</div></div>`;
        }
        html += `</div>`;
      });
    }
  }

  // FAB + modal
  html += `<button class="fab" onclick="openModal()" aria-label="Legg til rutine">+</button>`;
  html += modalHTML();

  document.getElementById("app").innerHTML = html;

  // autofokus på input i modalen
  const ai = document.querySelector(".modal textarea");
  if(ai && !ai.value) ai.focus();
  const gi = document.getElementById("new-goal-inp");
  if(gi) gi.focus();
  const li = document.getElementById("b-loc-inp");
  if(li){ li.focus(); li.value = bNewLocInput; }
}

load();
</script>
</body>
</html>
